name: Build and package
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Harbor.sln --locked-mode
      - run: dotnet build Harbor.sln -c Release --no-restore
      - run: dotnet test Harbor.sln -c Release --no-build --logger trx
      - run: bash packaging/publish.sh
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-linux-x64
          path: |
            artifacts/harbor-linux-x64.tar.gz
            artifacts/SHA256SUMS
